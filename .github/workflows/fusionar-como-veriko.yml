name: Fusionar por avance rápido

on:
  workflow_call:
    inputs:
      pr:
        description: Número del pull request que se fusiona en main.
        required: true
        type: number
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

permissions:
  contents: read

concurrency:
  group: fusionar-${{ github.repository }}
  cancel-in-progress: false

# Mueve main a la cabeza del pull request sin crear commits nuevos: los commits
# que llegan a main son los mismos que se revisaron. Los scripts salen del mismo
# commit que este workflow (job.workflow_sha), no de una rama móvil.
jobs:
  fusionar:
    name: Fusionar por avance rápido
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Crear un token efímero de veriko-labs
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-checks: read
          permission-contents: write
          permission-pull-requests: read
          permission-statuses: read

      - name: Obtener los scripts del commit de este workflow
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REPOSITORY" != 'veriko-mx-labs/.github' ]]; then
            echo "::error::El workflow reusable viene de '$WORKFLOW_REPOSITORY', no de veriko-mx-labs/.github."
            exit 1
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha no es un SHA completo: '$WORKFLOW_SHA'."
            exit 1
          fi
          source_dir="$RUNNER_TEMP/veriko-workflow"
          git init --quiet "$source_dir"
          git -C "$source_dir" fetch --quiet --depth 1 \
            "https://github.com/${WORKFLOW_REPOSITORY}.git" "$WORKFLOW_SHA"
          git -C "$source_dir" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$WORKFLOW_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Comprobar y fusionar
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ inputs.pr }}
        run: >-
          python "$RUNNER_TEMP/veriko-workflow/actions/fusionar/fusionar.py"
          --pr "$PR"
          --esperar 0
