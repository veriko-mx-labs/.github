name: Autoría de commits

on:
  workflow_call:
    secrets:
      config:
        description: Configuración de la organización para la comprobación de contenido.
        required: false

permissions:
  contents: read

# Los scripts salen del mismo commit que este workflow (job.workflow_sha), no de
# una rama móvil.
jobs:
  autoria:
    name: Autoría de commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Obtener los scripts del commit de este workflow
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REPOSITORY" != 'veriko-mx-labs/.github' ]]; then
            echo "::error::El workflow reusable viene de '$WORKFLOW_REPOSITORY', no de veriko-mx-labs/.github."
            exit 1
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha no es un SHA completo: '$WORKFLOW_SHA'."
            exit 1
          fi
          source_dir="$RUNNER_TEMP/veriko-workflow"
          git init --quiet "$source_dir"
          git -C "$source_dir" fetch --quiet --depth 1 \
            "https://github.com/${WORKFLOW_REPOSITORY}.git" "$WORKFLOW_SHA"
          git -C "$source_dir" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$WORKFLOW_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Comprobar autoría y contenido
        shell: bash
        env:
          AUTORIA_CONFIG: ${{ secrets.config }}
        run: >-
          python "$RUNNER_TEMP/veriko-workflow/actions/verify-authorship/verify_authorship.py"
          --repo "$GITHUB_WORKSPACE"
          --event "$GITHUB_EVENT_PATH"
